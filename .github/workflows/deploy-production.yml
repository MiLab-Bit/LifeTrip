# REL-12 / REL-16 · 生产部署走 GitHub Actions，并由 production Environment 卡一道人工批准
#
# 为什么要有它：`production` Environment 早就建好、required reviewers 也配了，
# 但**没有任何 workflow 引用它**——闸门是空转的（部署一直是「人在服务器上跑 deploy.sh」）。
# 这个 workflow 把「部署到生产」变成一次需要在 GitHub 上点批准的动作。
#
# 触发方式：手动（workflow_dispatch）。发布是有意的动作，不该每次打 tag 都自动打到生产；
# 打 tag 只产出 Release 资产（见 release.yml），要不要上生产由人来决定。
#
# 需要的 Environment secrets（只在这个 Environment 里可见；未批准前运行读不到）：
#   LIFETRIP_DEPLOY_HOST   LIFETRIP_DEPLOY_USER   LIFETRIP_SSH_KEY
# 配置步骤见 milab-release/docs/最小权限发布凭据.md。
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署到生产的 tag（例如 v2026.10.2）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ★ 审批闸门：job 引用 production Environment 之后，没有 required reviewer
    #   点「Approve and run」就不会开始执行；未批准前也读不到该 Environment 的 secret。
    environment: production
    steps:
      - name: 校验 tag 形态（防止把奇怪的东西拼进远端命令）
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          printf '%s' "$DEPLOY_TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]+$' \
            || { echo "::error::tag 必须形如 vYYYY.MM.<build>（版本号方案见 RELEASE.md）"; exit 1; }
          echo "target=$DEPLOY_TAG"

      - name: 检查 Environment secrets 是否就位
        env:
          H: ${{ secrets.LIFETRIP_DEPLOY_HOST }}
          U: ${{ secrets.LIFETRIP_DEPLOY_USER }}
          K: ${{ secrets.LIFETRIP_SSH_KEY }}
        run: |
          set -eu
          missing=""
          [ -n "$H" ] || missing="$missing LIFETRIP_DEPLOY_HOST"
          [ -n "$U" ] || missing="$missing LIFETRIP_DEPLOY_USER"
          [ -n "$K" ] || missing="$missing LIFETRIP_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::production Environment 还缺这些 secret：$missing —— 配置步骤见 milab-release/docs/最小权限发布凭据.md"
            exit 1
          fi
          echo "Environment secrets 已就位"

      - name: 部署生产并就地验收（SSH 到服务器执行 deploy.sh）
        env:
          DEPLOY_HOST: ${{ secrets.LIFETRIP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LIFETRIP_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.LIFETRIP_SSH_KEY }}
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_TAG='$DEPLOY_TAG' bash -s" <<'EOSSH'
          set -eu
          APP_DIR=/opt/lifetrip TARGET_ENV=production HEALTH_PATH=/v1/health \
            bash /opt/lifetrip/scripts/deploy.sh "$DEPLOY_TAG"
          echo "--- 就地验收 ---"
          curl -fsS --max-time 10 http://127.0.0.1:8800/v1/health; echo
          BODY="$(curl -sS --max-time 30 -X POST http://127.0.0.1:8800/v1/isochrone/analyze \
            -H 'Content-Type: application/json' \
            -d '{"center":{"lat":31.2304,"lng":121.4737},"minutes":15}')"
          printf '%s' "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); i=d["isochrone"]; print("isochrone degraded=%s data_source=%s rays=%d" % (i["degraded"], i["data_source"], len(i["rays"]))); assert i["degraded"] is False and i["data_source"]=="osrm", "isochrone 仍是降级状态"'
          EOSSH
          rm -f ~/.ssh/deploy_key
