# REL-8 · 门禁 CI（零配置版）
# 只做两件事：把环境装上，然后调用 scripts/preflight.sh。
# preflight 会自己识别这个仓库里有哪些检查项，所以这里不需要写死目录名或命令。
# 唯一必需的检查名：preflight
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仓库结构探测（失败排查时看这段日志）
        run: |
          echo "--- 顶层 ---"; ls -a
          echo "--- package.json ---"
          find . -maxdepth 3 -name package.json -not -path "*/node_modules/*" || true
          echo "--- python 线索 ---"
          ls -a | grep -iE "python-version|pyproject|requirements|setup.py" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 待确认：按你本地版本改一行即可（其余不用改）

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Python 依赖（有才装）
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != '' }}
        run: |
          python -m pip install -U pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f pyproject.toml ] && (pip install -e . || pip install .) || true
          [ -f setup.py ] && pip install . || true

      - name: 安装前端依赖（有才装）
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          set -e
          dir="$(dirname "$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)")"
          echo "前端目录：$dir"
          cd "$dir"
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile;
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile;
          elif [ -f package-lock.json ]; then npm ci;
          else npm install; fi

      - name: 跑门禁（唯一入口）
        if: ${{ hashFiles('scripts/preflight.sh') != '' }}
        run: bash scripts/preflight.sh

      - name: 没有门禁脚本时的兜底
        if: ${{ hashFiles('scripts/preflight.sh') == '' }}
        run: |
          echo "::warning::仓库里还没有 scripts/preflight.sh，本次只做了依赖安装验证"
